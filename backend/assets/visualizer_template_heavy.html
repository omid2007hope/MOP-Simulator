<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Impact Physics &amp; Penetration WebGL Visualizer</title>

    <!-- P-011: Preconnect eliminates DNS+TLS round-trip latency for fonts (saves 200-400ms) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- P-010: Tailwind config scope limit prevents full DOM re-scan on every React re-render -->
    <script>tailwind = { corePlugins: { preflight: false } };</script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- P-008: Production builds remove prop-type checking (~30-40% less render overhead) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- P-009: Babel standalone removed — UI uses React.createElement (saves 800KB + 500ms parse time) -->

    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
    <style>
      :root { --hud-glow: rgba(56,189,248,0.2); }
      body { margin:0; overflow:hidden; background-color:#05080f; font-family:"Inter",sans-serif; color:#f1f5f9; user-select:none; }
      .mono { font-family:"JetBrains Mono",monospace; }
      /* P-001 will-change:transform — discrete GPU compositor layer
         P-002 contain:strict — isolates canvas layout/paint from React HUD DOM tree
         P-003 user-select:none — prevents text-selection event processing overhead */
      #renderCanvas {
        width:100vw; height:100vh; position:absolute; top:0; left:0; z-index:1;
        touch-action:none; outline:none;
        will-change:transform; contain:strict; user-select:none;
      }
      /* P-004 blur 24px→8px (4× cheaper GPU composite pass per panel)
         P-005 skewX removed — eliminates anti-aliased compositing pass per panel
         P-006 box-shadow removed from transition — only border-color is compositor-accelerated */
      .glass-panel {
        background:rgba(9,14,23,0.75); backdrop-filter:blur(8px);
        border:1px solid rgba(56,189,248,0.25);
        box-shadow:inset 0 0 20px var(--hud-glow), 0 20px 50px rgba(0,0,0,0.7);
        transition:border-color 0.3s ease;
      }
      .glass-panel:hover {
        border-color:rgba(56,189,248,0.65);
        box-shadow:inset 0 0 30px rgba(56,189,248,0.35), 0 20px 50px rgba(0,0,0,0.85);
      }
      /* P-005: no skew on panel = no counter-skew needed on content */
      .unskew { transform:none; }
      .progress-bar { transition:width 0.1s linear; }
      ::-webkit-scrollbar { height:6px; }
      ::-webkit-scrollbar-track { background:rgba(0,0,0,0.2); border-radius:10px; }
      ::-webkit-scrollbar-thumb { background:#0ea5e9; border-radius:10px; }
      /* P-007: opacity animation replaces box-shadow animation — compositor-safe, zero paint */
      .pulse-active { animation:pulseGlow 1.5s infinite; }
      @keyframes pulseGlow { 0%,100%{opacity:0.75;} 50%{opacity:1.0;} }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100">

    <canvas id="renderCanvas"></canvas>
    <div id="react-root" class="pointer-events-none absolute inset-0 z-10 w-full h-full overflow-hidden"></div>

    <!-- P-012: defer — Babylon.js downloads without blocking HTML parse -->
    <script src="https://cdn.babylonjs.com/babylon.js" defer></script>
    <!-- P-012: defer — ECharts downloads without blocking HTML parse -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js" defer></script>

    <!-- SCENARIO DATA + ENGINE (inline — runs synchronously so 'scenarios' is defined before React renders) -->
    <script>
      const scenarios = [
        /*{{SCENARIOS_DATA}}*/
      ];

      // P-070: Debug gate — skip V8 object serialization unless explicitly enabled
      if (window.DEBUG) { scenarios.forEach((d,i)=>console.log("Scenario "+i+":",d)); }

      // ─── Engine & Scene Globals ───────────────────────────────────────
      let engine, scene, camera, pipeline;
      let projectile, shockwave, explosionSphere, boomRing, machCone;
      let activeCrater=null, dustSPS=null, ambientDustMesh=null;
      let ambientDustPositions=null, ambientDustMaxH=90, ambientDustScaleK=2.2/90;
      let targetLayerMeshes=[], airMeshes=[], rulerMeshes=[];
      let currentData=scenarios[0]||null;
      let animState="IDLE", simTime=0, prevFrame=null;
      let followCam=false, simSpeedMultiplier=1.0;
      let explosionTriggered=false, cameraShake=0, boomRingGrowthRate=15.0;
      let cameraAnimatables=[], _shakeOX=0, _shakeOY=0;

      // P-055: Ring buffer for ECharts (replaces O(n) push/shift on arrays)
      const CHART_BUF=100;
      const chartBufTime=new Array(CHART_BUF).fill(''), chartBufVel=new Array(CHART_BUF).fill(0);
      let chartBufIdx=0, chartBufFull=false, telemetryChart;

      // P-054: Pre-seeded jitter LUT — replaces Math.random() in render hot-loop
      const JLUT=new Float32Array(256); for(let _j=0;_j<256;_j++)JLUT[_j]=Math.random()-0.5;
      let _ji=0; function jit(){return JLUT[(_ji=(_ji+1)&255)];}

      // P-047: Module-level lerp (no closure per interpolation call)
      let _lf=0; function lv(a,b){return(a!==undefined&&b!==undefined)?a+(b-a)*_lf:undefined;}

      // P-046: Pre-allocated interpolation result — zero garbage at 60fps
      const _IF={t:0,y:0,v:0,m:0,p:0,g:0,h:0,dif:1,rl:0,ob:0,obliquity_deg:0,aoa_deg:0,pr:0,sb:false,e:false,
        cvx:0,cvy:0,up:0,us:0,ps:0,tp:0,se:0,af:0,bm:0,mbs:0,sr:0,es:0,tf:0,iev:0,hr:0,eh:0,ml:0,eld:0,dc:0,df:0,gp:0};

      // P-044/P-045: Pre-allocated color constants (set in init after BABYLON loads)
      let C3_CYAN, C3_WHITE, C3_PURPLE, _pC1, _pC2, _pC3, _pC4, _planckOut;

      // P-030: Pre-allocated crater path vectors (set in init)
      let _craterPath=null;

      // P-074: Pre-allocated GBU57 lathe profile (22 points)
      const _gbu57Pts=[]; // filled in init after BABYLON loads

      // P-051: Cache last ruler maxAlt to skip redundant rebuilds
      let _lastRulerAlt=-1;

      // Audio
      let audioCtx=null, anthemNodes=[];
      ["click","keydown","pointerdown"].forEach(ev=>
        window.addEventListener(ev,()=>{if(audioCtx&&audioCtx.state==="suspended")audioCtx.resume().catch(()=>{});},{passive:true})
      );

      // ─── Helper ───────────────────────────────────────────────────────
      function c3(hex){return new BABYLON.Color3(((hex>>16)&0xff)/255,((hex>>8)&0xff)/255,(hex&0xff)/255);}

      // ─── INIT ─────────────────────────────────────────────────────────
      function init(){
        const canvas=document.getElementById("renderCanvas");
        // P-019/P-020/P-021: Full engine performance options
        engine=new BABYLON.Engine(canvas,false,{powerPreference:"high-performance",preserveDrawingBuffer:false,doNotHandleTouchAction:true,stencil:false},true);
        // P-022: Parallel shader compile validation
        if(engine.getCaps().parallelShaderCompile)console.log("[Perf] parallelShaderCompile ACTIVE");

        scene=new BABYLON.Scene(engine);
        scene.clearColor=new BABYLON.Color4(5/255,8/255,15/255,1);
        scene.fogMode=BABYLON.Scene.FOGMODE_LINEAR; scene.fogColor=new BABYLON.Color3(5/255,8/255,15/255);
        scene.fogStart=300; scene.fogEnd=2000;

        const dx0=45,dy0=45,dz0=60,r0=Math.sqrt(dx0*dx0+dy0*dy0+dz0*dz0);
        camera=new BABYLON.ArcRotateCamera("cam",Math.atan2(dz0,dx0),Math.acos(dy0/r0),r0,new BABYLON.Vector3(0,-15,0),scene);
        camera.lowerRadiusLimit=5; camera.upperRadiusLimit=350; camera.upperBetaLimit=Math.PI/2+0.1;
        camera.inertia=0.85; // P-072: reduced from 0.9
        camera.wheelPrecision=5; camera.attachControl(canvas,true);

        // P-067: bloomKernel 64→32 (halves GPU blur cost)
        pipeline=new BABYLON.DefaultRenderingPipeline("pp",true,scene,[camera]);
        pipeline.bloomEnabled=true; pipeline.bloomThreshold=0.2; pipeline.bloomWeight=1.2;
        pipeline.bloomKernel=32; pipeline.bloomScale=0.5;

        // P-044/P-045: Init cached colors
        C3_CYAN=new BABYLON.Color3(0,1,1); C3_WHITE=new BABYLON.Color3(1,1,1);
        C3_PURPLE=new BABYLON.Color3(0.576,0.204,0.976);
        _pC1=c3(0xd97706); _pC2=c3(0xf97316); _pC3=c3(0xfffbeb); _pC4=c3(0xe0f2fe);
        _planckOut=new BABYLON.Color3(0,0,0);

        // P-030: Init crater path
        _craterPath=[new BABYLON.Vector3(0,0.1,0),new BABYLON.Vector3(0,0,0),new BABYLON.Vector3(0,0,0)];

        // P-074: Init GBU57 profile
        for(let _g=0;_g<22;_g++)_gbu57Pts.push(new BABYLON.Vector3(0,0,0));

        setupLighting(); setupEnvironment(); setupProjectile(); setupEffects(); initECharts();
        // P-064: Resize ECharts on window resize
        window.addEventListener("resize",()=>{engine.resize();if(telemetryChart)telemetryChart.resize();});
        scene.registerBeforeRender(animationLoop);
        scene.registerAfterRender(()=>{if(_shakeOX||_shakeOY){camera.alpha-=_shakeOX;camera.beta-=_shakeOY;_shakeOX=_shakeOY=0;}});
        engine.runRenderLoop(()=>scene.render());
        if(scenarios.length>0)selectScenario(0);
      }

      // ─── LIGHTING ─────────────────────────────────────────────────────
      function setupLighting(){
        const hemi=new BABYLON.HemisphericLight("hemi",new BABYLON.Vector3(0,1,0),scene);
        hemi.intensity=0.6; hemi.groundColor=c3(0x0f172a);
        const dir=new BABYLON.DirectionalLight("dir",new BABYLON.Vector3(-50,-100,-50).normalize(),scene);
        dir.intensity=2.5; dir.diffuse=c3(0xfff0dd);
        // P-029: Limit shadow frustum range
        dir.shadowMinZ=-50; dir.shadowMaxZ=250;
        const sg=new BABYLON.ShadowGenerator(2048,dir);
        // P-029: Blur exponential cheaper than Poisson sampling
        sg.useBlurExponentialShadowMap=true; window._shadowGen=sg;
        const fill=new BABYLON.PointLight("fill",new BABYLON.Vector3(-30,20,-30),scene);
        fill.intensity=1.0; fill.diffuse=c3(0x38bdf8); fill.range=100;
        window._lights={hemi,dir,fill};
      }

      // ─── ENVIRONMENT ─────────────────────────────────────────────────
      // P-023/P-024: Single CreateLineSystem replaces 202 individual meshes (202 draw calls → 1)
      function setupEnvironment(){
        const half=100,divs=100,step=(half*2)/divs;
        const lp=[],lc=[];
        for(let i=0;i<=divs;i++){
          const p=-half+i*step,major=i%10===0;
          const col=major?new BABYLON.Color4(0.06,0.65,0.91,0.5):new BABYLON.Color4(0.12,0.16,0.24,0.5);
          lp.push([new BABYLON.Vector3(-half,0.1,p),new BABYLON.Vector3(half,0.1,p)]);lc.push([col,col]);
          lp.push([new BABYLON.Vector3(p,0.1,-half),new BABYLON.Vector3(p,0.1,half)]);lc.push([col,col]);
        }
        const grid=BABYLON.MeshBuilder.CreateLineSystem("grid",{lines:lp,colors:lc},scene);
        grid.freezeWorldMatrix(); grid.isPickable=false; // P-023/P-068
        // P-028: Exclude static grid from all light calculations
        if(window._lights){window._lights.hemi.excludedMeshes.push(grid);window._lights.dir.excludedMeshes.push(grid);window._lights.fill.excludedMeshes.push(grid);}
      }

      // ─── TEXT SPRITE ──────────────────────────────────────────────────
      function createTextSprite(msg,colorHex){
        const uid=Math.random().toString(36).slice(2);
        const dt=new BABYLON.DynamicTexture("dt"+uid,{width:256,height:128},scene,false);
        const ctx=dt.getContext(); ctx.font="Bold 36px 'JetBrains Mono',monospace"; ctx.fillStyle=colorHex; ctx.fillText(msg,10,50); dt.update();
        const plane=BABYLON.MeshBuilder.CreatePlane("lbl"+uid,{width:20,height:10},scene);
        const mat=new BABYLON.StandardMaterial("lblm"+uid,scene);
        mat.diffuseTexture=dt; mat.emissiveTexture=dt; mat.disableLighting=true; mat.backFaceCulling=false; mat.useAlphaFromDiffuseTexture=true;
        mat.freeze(); // P-027: material never changes after creation
        plane.material=mat; plane.billboardMode=BABYLON.Mesh.BILLBOARDMODE_ALL; plane.isPickable=false; // P-068
        return plane;
      }

      // ─── RULERS ───────────────────────────────────────────────────────
      function rebuildRulers(maxAlt){
        rulerMeshes.forEach(m=>{if(!m.isDisposed()){if(m.material)m.material.dispose(true,true);m.dispose();}});
        rulerMeshes=[];
        const dL=BABYLON.MeshBuilder.CreateLines("dLine",{points:[new BABYLON.Vector3(14,0,14),new BABYLON.Vector3(14,-150,14)]},scene);
        dL.color=c3(0x38bdf8); dL.freezeWorldMatrix(); dL.isPickable=false; rulerMeshes.push(dL); // P-025/P-068
        for(let d=0;d<=150;d++){
          const major=d%10===0,medium=d%5===0&&!major;
          let len=0.8,rad=0.08; if(major){len=3.5;rad=0.2;}else if(medium){len=2.0;rad=0.12;}
          let tHex=0x38bdf8; if(d>30)tHex=0xfacc15; if(d>80)tHex=0xf87171;
          const tk=BABYLON.MeshBuilder.CreateCylinder("td"+d,{diameter:rad*2,height:len,tessellation:6},scene);
          tk.rotation.z=Math.PI/2; tk.position.copyFromFloats(14+len/2,-d,14);
          const tm=new BABYLON.StandardMaterial("tdm"+d,scene);
          tm.emissiveColor=c3(tHex); tm.disableLighting=true; tm.freeze(); // P-027
          tk.material=tm; tk.bakeCurrentTransformIntoVertices(); tk.freezeWorldMatrix(); tk.isPickable=false; // P-025/P-068
          rulerMeshes.push(tk);
          if(major){const sp=createTextSprite(d+"m","#"+tHex.toString(16).padStart(6,"0")); sp.position.copyFromFloats(14+len+3,-d,14); sp.freezeWorldMatrix(); rulerMeshes.push(sp);}
        }
        const altLim=Math.max(50,Math.ceil((maxAlt>0?maxAlt:50)/10)*10);
        const aL=BABYLON.MeshBuilder.CreateLines("aLine",{points:[new BABYLON.Vector3(-15,0,-15),new BABYLON.Vector3(-15,altLim,-15)]},scene);
        aL.color=c3(0x0ea5e9); aL.freezeWorldMatrix(); aL.isPickable=false; rulerMeshes.push(aL); // P-025/P-068
        for(let a=0;a<=altLim;a++){
          const major=a%10===0,medium=a%5===0&&!major;
          let len=0.8,rad=0.08; if(major){len=3.5;rad=0.2;}else if(medium){len=2.0;rad=0.12;}
          const tk=BABYLON.MeshBuilder.CreateCylinder("ta"+a,{diameter:rad*2,height:len,tessellation:6},scene);
          tk.rotation.z=Math.PI/2; tk.position.copyFromFloats(-15-len/2,a,-15);
          const tm=new BABYLON.StandardMaterial("tam"+a,scene);
          tm.emissiveColor=c3(0x0ea5e9); tm.disableLighting=true; tm.freeze(); // P-027
          tk.material=tm; tk.bakeCurrentTransformIntoVertices(); tk.freezeWorldMatrix(); tk.isPickable=false; // P-025/P-068
          rulerMeshes.push(tk);
          if(major&&a>0){const sp=createTextSprite(a+"m","#0ea5e9"); sp.position.copyFromFloats(-15-len-3,a,-15); sp.freezeWorldMatrix(); rulerMeshes.push(sp);}
        }
      }

      // ─── WEB AUDIO ANTHEM ─────────────────────────────────────────────
      function playAnthem(){
        stopAnthem();
        try{
          audioCtx=new(window.AudioContext||window.webkitAudioContext)();
          if(audioCtx.state==="suspended")audioCtx.resume().catch(()=>{});
          const notes=[{f:392.0,d:0.35},{f:329.63,d:0.35},{f:261.63,d:0.6},{f:329.63,d:0.6},{f:392.0,d:0.6},{f:523.25,d:1.1},{f:659.25,d:0.7},{f:587.33,d:0.35},{f:523.25,d:0.6},{f:329.63,d:0.6},{f:370.0,d:0.6},{f:392.0,d:1.1},{f:392.0,d:0.35},{f:392.0,d:0.35},{f:659.25,d:0.7},{f:587.33,d:0.35},{f:523.25,d:0.6},{f:493.88,d:0.6},{f:440.0,d:0.6},{f:493.88,d:0.6},{f:523.25,d:1.2},{f:523.25,d:0.35},{f:523.25,d:0.35},{f:659.25,d:0.6},{f:698.46,d:0.6},{f:783.99,d:1.0},{f:783.99,d:0.6},{f:659.25,d:0.35},{f:587.33,d:0.6},{f:523.25,d:0.6},{f:587.33,d:1.2},{f:659.25,d:0.6},{f:659.25,d:0.35},{f:587.33,d:0.35},{f:523.25,d:0.6},{f:493.88,d:0.6},{f:440.0,d:0.6},{f:493.88,d:0.6},{f:523.25,d:1.4},{f:523.25,d:0.35},{f:523.25,d:0.35},{f:392.0,d:0.6},{f:329.63,d:0.6},{f:392.0,d:0.6},{f:523.25,d:1.4}];
          let t=audioCtx.currentTime+0.05;
          const mg=audioCtx.createGain(); mg.gain.setValueAtTime(0.18,t); mg.connect(audioCtx.destination); anthemNodes.push(mg);
          notes.forEach(n=>{const osc=audioCtx.createOscillator(),g=audioCtx.createGain(); osc.type="sawtooth"; osc.frequency.setValueAtTime(n.f,t); g.gain.setValueAtTime(0.001,t); g.gain.linearRampToValueAtTime(0.2,t+0.04); g.gain.exponentialRampToValueAtTime(0.001,t+n.d*0.95); osc.connect(g);g.connect(mg);osc.start(t);osc.stop(t+n.d); anthemNodes.push(osc,g); t+=n.d;});
        }catch(e){console.log("AudioCtx:",e);}
      }
      function stopAnthem(){anthemNodes.forEach(n=>{try{if(n.stop)n.stop();if(n.disconnect)n.disconnect();}catch(e){}});anthemNodes=[];if(audioCtx&&audioCtx.state!=="closed"){try{audioCtx.close();}catch(e){}}}

      // ─── PLANCK BLACKBODY COLOR (P-045: LerpToRef — zero Color3 allocations) ────
      function computePlanckBlackbodyColor(tempK,baseColor){
        if(tempK<500){_planckOut.copyFrom(baseColor);return _planckOut;}
        if(tempK<900) {BABYLON.Color3.LerpToRef(baseColor,_pC1,(tempK-500)/400,_planckOut);return _planckOut;}
        if(tempK<1500){BABYLON.Color3.LerpToRef(_pC1,_pC2,(tempK-900)/600,_planckOut);return _planckOut;}
        if(tempK<2200){BABYLON.Color3.LerpToRef(_pC2,_pC3,(tempK-1500)/700,_planckOut);return _planckOut;}
        BABYLON.Color3.LerpToRef(_pC3,_pC4,Math.min(1.0,(tempK-2200)/1000),_planckOut); return _planckOut;
      }

      // ─── GBU-57 MESH (P-074: pre-allocated pts array — zero new Vector3 per rebuild) ─
      function createGBU57Mesh(pRadius,pLength){
        const nL=pLength*0.25,bL=pLength*0.55,tL=pLength*0.2,hL=pLength/2,yN=-hL,yBs=yN+nL,yBe=yBs+bL,yTe=hL;
        _gbu57Pts[0].copyFromFloats(0,yN,0);
        for(let i=1;i<=12;i++){const t=i/12;_gbu57Pts[i].copyFromFloats(pRadius*Math.sin(t*Math.PI*0.5),yN+t*nL,0);}
        _gbu57Pts[13].copyFromFloats(pRadius,yBs,0);_gbu57Pts[14].copyFromFloats(pRadius,yBe*0.5,0);
        _gbu57Pts[15].copyFromFloats(pRadius*1.03,yBe*0.52,0);_gbu57Pts[16].copyFromFloats(pRadius*1.03,yBe*0.55,0);
        _gbu57Pts[17].copyFromFloats(pRadius,yBe*0.57,0);_gbu57Pts[18].copyFromFloats(pRadius,yBe,0);
        _gbu57Pts[19].copyFromFloats(pRadius*0.7,yTe-tL*0.2,0);_gbu57Pts[20].copyFromFloats(pRadius*0.5,yTe,0);_gbu57Pts[21].copyFromFloats(0,yTe,0);
        const body=BABYLON.MeshBuilder.CreateLathe("body",{shape:_gbu57Pts,tessellation:32,sideOrientation:BABYLON.Mesh.DOUBLESIDE},scene);
        const parts=[body];
        const fW=pRadius*1.8,fH=tL*0.8,fT=pRadius*0.12;
        for(let a=0;a<4;a++){const ang=(a*Math.PI)/2;const f=BABYLON.MeshBuilder.CreateBox("fin"+a,{width:fT,height:fH,depth:fW},scene);f.rotation.y=-ang;f.position.x=Math.cos(ang)*(pRadius*0.5+fW/2);f.position.z=Math.sin(ang)*(pRadius*0.5+fW/2);f.position.y=yBe+fH*0.3;f.bakeCurrentTransformIntoVertices();parts.push(f);}
        const sT=pRadius*0.12,sH=bL*0.5,sW=pRadius*0.25;
        for(let a=0;a<4;a++){const ang=(a*Math.PI)/2+Math.PI/4;const s=BABYLON.MeshBuilder.CreateBox("strk"+a,{width:sT,height:sH,depth:sW},scene);s.rotation.y=-ang;s.position.x=Math.cos(ang)*(pRadius+sT/2);s.position.z=Math.sin(ang)*(pRadius+sT/2);s.position.y=yBs+bL*0.4;s.bakeCurrentTransformIntoVertices();parts.push(s);}
        return BABYLON.Mesh.MergeMeshes(parts,true,true)||body;
      }

      // ─── PROJECTILE SETUP ─────────────────────────────────────────────
      function setupProjectile(){
        const d=currentData||scenarios[0]||{};
        const r=(d.proj_diameter||0.3)/2,l=d.proj_length||4;
        const mesh=createGBU57Mesh(r,l); mesh._cr=r; mesh._cl=l;
        const mat=new BABYLON.PBRMaterial("projMat",scene);
        mat.albedoColor=C3_CYAN.clone(); mat.metallic=0.3; mat.roughness=0.2;
        mat.emissiveColor=C3_CYAN.clone(); mat.emissiveIntensity=10.0;
        mat.clearCoat.isEnabled=true; mat.clearCoat.intensity=0.8; mat.clearCoat.roughness=0.1;
        mat.fogEnabled=false; // P-069
        mesh.material=mat; mesh.castShadows=true; mesh.receiveShadows=true; mesh.isPickable=false; // P-068
        if(window._shadowGen)window._shadowGen.addShadowCaster(mesh);
        projectile=mesh;
      }

      // ─── EFFECTS SETUP ────────────────────────────────────────────────
      function setupEffects(){
        shockwave=BABYLON.MeshBuilder.CreateSphere("sw",{diameter:8,segments:32},scene);

        _IF.cvx=lv(f0.cvx,f1.cvx);_IF.cvy=lv(f0.cvy,f1.cvy);_IF.up=lv(f0.up,f1.up);_IF.us=lv(f0.us,f1.us);_IF.ps=lv(f0.ps,f1.ps);
        _IF.tp=lv(f0.tp,f1.tp);_IF.se=lv(f0.se,f1.se);_IF.af=lv(f0.af,f1.af);_IF.bm=lv(f0.bm,f1.bm);_IF.mbs=lv(f0.mbs,f1.mbs);
        _IF.sr=lv(f0.sr,f1.sr);_IF.es=lv(f0.es,f1.es);_IF.tf=lv(f0.tf,f1.tf);_IF.iev=lv(f0.iev,f1.iev);_IF.hr=lv(f0.hr,f1.hr);

      // ─── MAIN ANIMATION LOOP ──────────────────────────────────────────
      function animationLoop(){
        const dt=Math.min(engine.getDeltaTime()/1000,0.1);
        // Ambient dust (runs in all states for visual continuity — P-052: 500 pts vs 2500)
        if(ambientDustMesh&&ambientDustPositions&&!ambientDustMesh.isDisposed()){
          const sk=ambientDustScaleK;
          for(let i=1;i<ambientDustPositions.length;i+=3){const y=ambientDustPositions[i],rho=Math.exp(-sk*y);ambientDustPositions[i]-=dt*(3.0+6.0*(1.0-rho));if(ambientDustPositions[i]<0){const u=Math.random();ambientDustPositions[i]=-Math.log(1-u*(1-Math.exp(-2.2)))/sk;}}
          ambientDustMesh.updateVerticesData(BABYLON.VertexBuffer.PositionKind,ambientDustPositions,false,false);
        }
        // P-057: Early return for non-active states — skip all simulation processing
        if(animState==="IDLE"||animState==="FINISHED"||animState==="LOADING")return;

        // Boom ring growth (P-031: setAll instead of new Vector3)
        if(boomRing.isVisible){const s=boomRing.scaling.x+dt*boomRingGrowthRate;boomRing.scaling.setAll(s);boomRing.material.alpha-=dt*1.5;if(boomRing.material.alpha<=0)boomRing.isVisible=false;}
        if(shockwave.isVisible){shockwave.rotation.y+=dt*2;shockwave.rotation.x+=dt;}

        // ── State Machine ──────────────────────────────────────────────
        if(animState==="PRE_DELAY"){
          simTime+=dt;
          if(simTime>1.0){animState=(currentData.drop_frames&&currentData.drop_frames.length>0)?"DROPPING":"PENETRATING";playAnthem();if(animState==="DROPPING")simTime=currentData.drop_frames[0].t;else if(currentData.pen_frames&&currentData.pen_frames.length>0)simTime=currentData.pen_frames[0].t;else simTime=0;}
        } else if(animState==="DROPPING"){
          simTime+=dt*simSpeedMultiplier;
          const maxT=currentData.drop_frames[currentData.drop_frames.length-1].t;
          if(simTime<maxT){
            const frame=getInterpolatedFrame(currentData.drop_frames,simTime);
            projectile.position.y=frame.y;
            const maxDA=Math.abs(currentData.drop_frames[0].y)||60,dp=Math.max(0,Math.min(1.0,1.0-frame.y/maxDA));
            const pitch=frame.pr!==undefined?frame.pr:(Math.PI/2.0)*(1.0-Math.pow(dp,0.75));
            projectile.rotation.z=pitch;
            if(frame.sb===true){boomRing.isVisible=true;boomRing.rotation.z=pitch;const ol=currentData.proj_length/2.0-1.8;boomRing.position.x=projectile.position.x-Math.sin(pitch)*ol;boomRing.position.y=projectile.position.y+Math.cos(pitch)*ol;boomRing.scaling.copyFromFloats(1,1,1);boomRing.material.alpha=1.0;boomRingGrowthRate=8.0+Math.min(30.0,frame.m)*1.2;} // P-034
            if(frame.v>343.0&&frame.m>1.0){machCone._coneParts.forEach(c=>{c.isVisible=true;});const sk2=2.2/(maxDA+30),rho=Math.exp(-sk2*Math.max(0,frame.y)),vf=Math.min(1.0,(frame.m-1.0)/0.7),int=vf*(0.35+0.65*rho);if(machCone._coneParts[0])machCone._coneParts[0].material.alpha=0.35*int;if(machCone._coneParts[1])machCone._coneParts[1].material.alpha=0.08*int;machCone.rotation.z=pitch;const ol=currentData.proj_length/2.0-1.8;machCone.position.x=projectile.position.x-Math.sin(pitch)*ol;machCone.position.y=projectile.position.y+Math.cos(pitch)*ol;const ma=Math.max(0.35,Math.min(1.2,1.4/Math.max(1.01,frame.m)));machCone.scaling.copyFromFloats(ma,1.0,ma);} // P-035
            else{machCone._coneParts.forEach(c=>{c.isVisible=false;});}
            updateHUD(frame);prevFrame=frame;
          } else {
            animState="PENETRATING";machCone._coneParts.forEach(c=>{c.isVisible=false;});shockwave.isVisible=false;
            if(currentData.pen_frames&&currentData.pen_frames.length>0)simTime=currentData.pen_frames[0].t;else simTime=0;
            prevFrame=null;cameraShake=currentData.camera_shake_magnitude;
          }
        } else if(animState==="PENETRATING"){
          if(!currentData.pen_frames||currentData.pen_frames.length===0){animState="EXPLODING";simTime=0;}
          else{
            const ps=currentData.pen_frames[0].t,pe=currentData.pen_frames[currentData.pen_frames.length-1].t;
            const pd=pe-ps,ts=pd>0?pd/5.0:1.0;
            simTime+=dt*ts*simSpeedMultiplier;

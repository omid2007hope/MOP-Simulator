<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Impact Physics &amp; Penetration WebGL Visualizer</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel (JSX in browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root { --hud-glow: rgba(56, 189, 248, 0.2); }
      body { margin: 0; overflow: hidden; background-color: #05080f; font-family: "Inter", sans-serif; color: #f1f5f9; user-select: none; }
      .mono { font-family: "JetBrains Mono", monospace; }
      #renderCanvas {
        width: 100vw; height: 100vh;
        position: absolute; top: 0; left: 0; z-index: 1;
        touch-action: none; outline: none;
      }
      .glass-panel {
        background: rgba(9, 14, 23, 0.75); backdrop-filter: blur(24px);
        border: 1px solid rgba(56, 189, 248, 0.25);
        box-shadow: inset 0 0 20px var(--hud-glow), 0 20px 50px rgba(0,0,0,0.7);
        transform: skewX(-2deg);
        transition: border-color 0.3s ease, box-shadow 0.3s ease;
      }
      .glass-panel:hover {
        border-color: rgba(56, 189, 248, 0.65);
        box-shadow: inset 0 0 30px rgba(56,189,248,0.35), 0 20px 50px rgba(0,0,0,0.85);
      }
      .unskew { transform: skewX(2deg); }
      .progress-bar { transition: width 0.1s linear; }
      ::-webkit-scrollbar { height: 6px; }
      ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 10px; }
      ::-webkit-scrollbar-thumb { background: #0ea5e9; border-radius: 10px; }
      .pulse-active { animation: pulseGlow 1.5s infinite; }
      @keyframes pulseGlow {
        0%   { box-shadow: 0 0 10px rgba(6,182,212,0.4); }
        50%  { box-shadow: 0 0 25px rgba(6,182,212,0.8); }
        100% { box-shadow: 0 0 10px rgba(6,182,212,0.4); }
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100">

    <!-- Babylon.js renders directly to this canvas -->
    <canvas id="renderCanvas"></canvas>

    <!-- React UI overlay -->
    <div id="react-root" class="pointer-events-none absolute inset-0 z-10 w-full h-full overflow-hidden"></div>

    <!-- REACT UI LAYER — identical contract to previous Three.js version -->
    <script type="text/babel">
      const { useState, useEffect, useCallback, useMemo } = React;

      // 41 fields exported by telemetry_exporter.cpp — must not change
      const STAT_KEYS = [
        "name", "velocity", "mach", "energy", "pressure", "yield", "depth", "prev_strike_depth",
        "rigid_depth", "hydro_depth", "fail", "shock_prob", "exp_survives", "is_kinetic", "regime",
        "summary", "proj_length", "proj_diameter", "proj_name", "target_name", "explosive_mass",
        "explosion_scale", "crater_wide_radius", "crater_narrow_radius", "camera_shake_magnitude",
        "time_scale_pen", "erosion_occurred", "final_rod_length", "erosion_length_lost",
        "dynamic_increase_factor", "bar_wave_speed", "shock_pressure_gpa_peak", "shock_pulse_duration_us",
        "previous_strike_depth", "cumulative_breach_depth", "kinetic_shock_joules",
        "total_explosive_yield", "altitude_ft", "premature_detonation", "x_acceleration", "y_acceleration"
      ];

      function App() {
        const [activeScenarioIdx, setActiveScenarioIdx] = useState(0);
        const [followCam, setFollowCam] = useState(false);
        const [simSpeed, setSimSpeedState] = useState(1.0);
        const [frameData, setFrameData] = useState({
          velocity: 0, pressure: 0, gforce: 0, depth: 0, phase: "RIGID", dif: 1.0, length: 0
        });
        const currentData = scenarios[activeScenarioIdx] || {};

        useEffect(() => {
          window.ReactAPI = {
            setFrameData:         (data) => setFrameData(prev => ({...prev, ...data})),
            setActiveScenarioIdx: (idx)  => setActiveScenarioIdx(idx),
            setFollowCam:         (val)  => setFollowCam(val),
            setSimSpeed:          (val)  => setSimSpeedState(val)
          };
        }, []);

        const handleScenarioClick = (idx)          => { if (window.selectScenario)   window.selectScenario(idx); };
        const handleCameraMove    = (x,y,z,tx,ty,tz) => { if (window.smoothCameraMove) window.smoothCameraMove(x,y,z,tx,ty,tz); };
        const toggleFollowCamBtn  = ()              => { if (window.toggleFollowCam)  window.toggleFollowCam(); };
        const changeSpeed         = (speed)         => { if (window.setSimSpeed)      window.setSimSpeed(speed); };

        const renderStatRow = (key) => {
          let val = currentData[key];
          if (typeof val === 'number') val = val % 1 === 0 ? val.toString() : val.toFixed(4);
          if (val === undefined || val === null) val = "-";
          return (
            <div key={key} className="flex justify-between items-center border-b border-slate-800/50 pb-1 pt-1">
              <span className="text-cyan-600/70 lowercase">{key}:</span>
              <span className="text-slate-200 text-right break-all ml-2">{val.toString()}</span>
            </div>
          );
        };

        let regimeText = currentData.is_kinetic ? "HYPERVELOCITY KINETIC ROD" :
                         (currentData.fail ? "CASING SHATTER" : (!currentData.exp_survives ? "FUZE FAILURE" : "WARHEAD DETONATED"));
        if (!currentData.fail && currentData.exp_survives && !currentData.is_kinetic) regimeText = "AWAITING IMPACT";

        return (
          <div className="w-full h-full relative">

            {/* Top Left HUD */}
            <div className="absolute top-6 left-6 w-[420px] rounded-xl glass-panel p-5 pointer-events-auto">
              <div className="unskew flex flex-col gap-3">
                <div className="border-b border-cyan-500/30 pb-3 mb-2 flex justify-between items-start">
                  <div>
                    <h1 className="text-[10px] font-black tracking-widest text-cyan-500 uppercase flex items-center gap-2 mb-1">
                      <span className="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
                      High-Fidelity Physics Telemetry
                    </h1>
                    <div className="text-xl font-bold text-white leading-tight uppercase tracking-wide">{currentData.name || "-"}</div>
                  </div>
                </div>
                <div className="space-y-3 text-xs mono">
                  <div className="flex flex-col gap-1">
                    <div className="flex justify-between text-slate-400">
                      <span>Velocity</span><span className="text-cyan-300 font-bold">{frameData.velocity.toFixed(1)} m/s</span>
                    </div>
                    <div className="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
                      <div className="bg-cyan-400 h-full progress-bar" style={{width: Math.min(100,(frameData.velocity/2000)*100)+'%'}}></div>
                    </div>
                  </div>
                  <div className="flex flex-col gap-1">
                    <div className="flex justify-between text-slate-400">
                      <span>Dynamic Pressure</span><span className="text-amber-400 font-bold">{frameData.pressure.toFixed(2)} GPa</span>
                    </div>
                    <div className="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden relative">
                      <div className="absolute top-0 bottom-0 w-0.5 bg-red-500 z-10" style={{left: (currentData.yield ? Math.min(100,(currentData.yield/2.0)*100) : 80)+'%'}}></div>
                      <div className="bg-amber-400 h-full progress-bar" style={{width: Math.min(100,(frameData.pressure/2.0)*100)+'%'}}></div>
                    </div>
                  </div>
                  <div className="flex justify-between items-center bg-slate-900/50 p-2 rounded-lg border border-slate-700/50 mt-2">
                    <div>
                      <div className="text-[9px] text-slate-500 uppercase tracking-wider">Deceleration</div>
                      <div className="text-rose-400 font-bold text-sm">{frameData.gforce.toFixed(0)} G</div>
                    </div>
                    <div className="text-right">
                      <div className="text-[9px] text-slate-500 uppercase tracking-wider">PENETRATION DEPTH</div>
                      <div className="text-emerald-400 font-black text-base">{frameData.depth.toFixed(2)} m</div>
                    </div>
                  </div>
                  <div className="flex justify-between items-center bg-slate-900/50 p-2 rounded-lg border border-slate-700/50 mt-2">
                    <div>
                      <div className="text-[9px] text-slate-500 uppercase tracking-wider">Phase</div>
                      <div className="text-cyan-300 font-bold text-sm">{frameData.phase}</div>
                    </div>
                    <div className="text-center">
                      <div className="text-[9px] text-slate-500 uppercase tracking-wider">Strain-Rate DIF</div>
                      <div className="text-amber-300 font-bold text-sm">{frameData.dif.toFixed(2)}x</div>
                    </div>
                    <div className="text-right">
                      <div className="text-[9px] text-slate-500 uppercase tracking-wider">Rod Length</div>
                      <div className="text-emerald-300 font-bold text-sm">{frameData.length.toFixed(2)} m</div>
                    </div>
                  </div>
                  <div className="flex justify-between items-center bg-slate-900/50 p-2 rounded-lg border border-slate-700/50 mt-2">
                    <div>
                      <div className="text-[9px] text-slate-500 uppercase tracking-wider">Shock Pressure</div>
                      <div className="text-orange-400 font-bold text-sm">{(currentData.shock_pressure_gpa_peak||0).toFixed(2)} GPa</div>
                    </div>
                    <div className="text-right">
                      <div className="text-[9px] text-slate-500 uppercase tracking-wider">Initiation Prob.</div>
                      <div className="text-rose-400 font-bold text-sm">{Math.min(100,currentData.shock_prob||0).toFixed(0)}%</div>
                    </div>
                  </div>
                  <div id="telemetry-chart" className="mt-2 h-24 w-full bg-slate-900/80 rounded border border-slate-700/50 relative overflow-hidden pointer-events-auto"></div>
                </div>
                <div className="mt-2 pt-3 border-t border-cyan-500/20 flex flex-col gap-2">
                  <div className={`px-3 py-2 rounded text-center text-[11px] font-black tracking-widest uppercase transition-all shadow-[0_0_15px_currentColor] ${currentData.is_kinetic ? 'bg-purple-500/20 text-purple-400 border border-purple-500/50 pulse-active' : (currentData.fail || !currentData.exp_survives ? 'bg-rose-500/20 text-rose-400 border border-rose-500/50 pulse-active' : 'bg-cyan-500/20 text-cyan-300 border border-cyan-500/50')}`}>
                    {regimeText}
                  </div>
                  <div className="px-3 py-1.5 rounded text-center text-[10px] font-bold tracking-widest bg-slate-800/80 text-slate-300 border border-slate-700">
                    {currentData.is_kinetic ? "PAYLOAD: ZERO EXPLOSIVE MASS" : "PAYLOAD: " + (currentData.explosive_mass || 0) + " kg"}
                  </div>
                  <div className="text-[10px] text-slate-400 text-center leading-tight px-1">
                    {(currentData.regime || "-") + (currentData.summary ? " — " + currentData.summary : "")}
                  </div>
                </div>
              </div>
            </div>

            {/* Top Right Controls */}
            <div className="absolute top-6 right-6 w-80 rounded-xl glass-panel p-5 pointer-events-auto">
              <div className="unskew">
                <h2 className="text-[10px] font-black tracking-widest text-slate-400 uppercase mb-3">Targeting &amp; Viewport</h2>
                <div className="grid grid-cols-2 gap-2 mb-4">
                  <button onClick={() => handleCameraMove(45,30,60,0,-15,0)}  className="px-2 py-2 rounded bg-slate-800/80 hover:bg-cyan-500 hover:text-black font-semibold text-xs border border-slate-600 transition">Isometric</button>
                  <button onClick={() => handleCameraMove(80,-15,0,0,-15,0)}  className="px-2 py-2 rounded bg-slate-800/80 hover:bg-cyan-500 hover:text-black font-semibold text-xs border border-slate-600 transition">Side Profile</button>
                  <button onClick={() => handleCameraMove(0,100,1,0,0,0)}     className="px-2 py-2 rounded bg-slate-800/80 hover:bg-cyan-500 hover:text-black font-semibold text-xs border border-slate-600 transition">Surface Top</button>
                  <button onClick={toggleFollowCamBtn}                         className="px-2 py-2 rounded bg-slate-800/80 hover:bg-cyan-500 hover:text-black font-semibold text-xs border border-slate-600 transition">
                    Follow Cam: {followCam ? "ON" : "OFF"}
                  </button>
                </div>
                <div className="flex gap-2">
                  {[0.1, 1.0, 5.0].map(s => (
                    <button key={s} onClick={() => changeSpeed(s)}
                      className={`flex-1 py-1.5 border rounded text-xs transition ${simSpeed === s ? 'bg-cyan-900 border-cyan-500 text-cyan-200' : 'bg-slate-800 border-slate-600 hover:bg-slate-700 text-white'}`}>
                      {s}x
                    </button>
                  ))}
                </div>
              </div>
            </div>

            {/* Bottom Right Data Statistics — all 41 STAT_KEYS from telemetry_exporter.cpp */}
            <div className="absolute bottom-5 right-8 w-80 rounded-xl glass-panel p-5 pointer-events-auto">
              <div className="unskew">
                <h1 className="text-[10px] font-black tracking-widest text-slate-400 uppercase mb-3">Data Statistics</h1>
                <div className="text-[9px] font-bold tracking-wider text-slate-400 flex flex-col gap-1 max-h-[50vh] overflow-y-auto">
                  {STAT_KEYS.map(key => renderStatRow(key))}
                </div>
              </div>
            </div>

            {/* Scenarios Carousel — buttons injected by {{SCENARIO_BUTTONS}} logic, handled via React */}
            <div className="absolute bottom-6 left-1/2 -translate-x-1/2 rounded-2xl glass-panel px-5 py-3 flex items-center gap-3 max-w-[80vw] overflow-x-auto pointer-events-auto">
              <div className="unskew flex gap-3 items-center">
                {scenarios.map((s, i) => (
                  <button
                    key={i}
                    onClick={() => handleScenarioClick(i)}
                    className={`scenario-btn px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-colors duration-200 ${activeScenarioIdx === i ? 'bg-cyan-500 text-slate-950 shadow-[0_0_15px_rgba(6,182,212,0.6)]' : 'bg-slate-800 text-slate-300 border border-slate-600 hover:bg-slate-700 hover:border-cyan-400/50'}`}
                  >
                    {s.name}
                  </button>
                ))}
              </div>
            </div>

          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("react-root"));
      root.render(<App />);
    </script>

    <!-- BABYLON.JS — replaces Three.js + OrbitControls + EffectComposer + UnrealBloomPass + TWEEN (7 scripts -> 1) -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>

    <!-- ECharts (unchanged) -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>

    <!-- SCENARIO DATA — injected by telemetry_exporter.cpp: replaceAll(html, "/*{{SCENARIOS_DATA}}*/", data) -->
    <script>
      const scenarios = [
        /*{{SCENARIOS_DATA}}*/
      ];

      // Debug: log all C++ exported fields to console
      function listAllData() {
        scenarios.forEach((d, i) => console.log("Scenario " + i + ":", d));
      }
      listAllData();

      // ─── Engine & Scene Globals ───────────────────────────────────────
      let engine, scene, camera, pipeline;

      // 3D objects
      let projectile, shockwave, explosionSphere, boomRing, machCone;
      let activeCrater         = null;
      let dustSPS              = null;   // SolidParticleSystem: 1000 impact dust fragments
      let ambientDustMesh      = null;   // custom updatable points mesh
      let ambientDustPositions = null;   // Float32Array — updated every frame in animationLoop
      let ambientDustMaxH      = 90;
      let ambientDustScaleK    = 2.2 / 90;

      // Mesh tracking arrays (replaces THREE.Group children lists)
      let targetLayerMeshes = [];
      let airMeshes         = [];
      let rulerMeshes       = [];

      // Animation state — same variable names as Three.js version
      let currentData          = scenarios[0];
      let animState            = "IDLE";
      let simTime              = 0;
      let prevFrame            = null;
      let followCam            = false;
      let simSpeedMultiplier   = 1.0;
      let explosionTriggered   = false;
      let cameraShake          = 0;
      let boomRingGrowthRate   = 15.0;

      // ECharts telemetry
      let telemetryChart;
      let chartDataTime = [];
      let chartDataVel  = [];

      // Camera animation handles (replaces TWEEN tweens)
      let cameraAnimatables = [];

      // Camera shake scratch offset — reverted in afterRender
      let _shakeOX = 0, _shakeOY = 0;

      // ─── Helper: BABYLON.Color3 from 0xRRGGBB hex ────────────────────
      function c3(hex) {
        return new BABYLON.Color3(
          ((hex >> 16) & 0xff) / 255,
          ((hex >>  8) & 0xff) / 255,
          ( hex        & 0xff) / 255
        );
      }

      // ─── INIT ─────────────────────────────────────────────────────────
      function init() {
        const canvas = document.getElementById("renderCanvas");

        // Engine — antialias=false matches original
        engine = new BABYLON.Engine(canvas, false, { powerPreference: "high-performance" }, true);

        scene = new BABYLON.Scene(engine);
        scene.clearColor = new BABYLON.Color4(5/255, 8/255, 15/255, 1);
        scene.fogMode    = BABYLON.Scene.FOGMODE_LINEAR;
        scene.fogColor   = new BABYLON.Color3(5/255, 8/255, 15/255);
        scene.fogStart   = 300;
        scene.fogEnd     = 2000;

        // ArcRotateCamera — replaces PerspectiveCamera + OrbitControls + TWEEN
        // Derive initial spherical coords from desired Cartesian pos (45,30,60)
        // relative to target (0,-15,0):  dx=45, dy=45, dz=60
        const dx0 = 45, dy0 = 45, dz0 = 60;
        const r0   = Math.sqrt(dx0*dx0 + dy0*dy0 + dz0*dz0);
        const b0   = Math.acos(dy0 / r0);
        const a0   = Math.atan2(dz0, dx0);

        camera = new BABYLON.ArcRotateCamera("cam", a0, b0, r0,
                   new BABYLON.Vector3(0, -15, 0), scene);
        camera.lowerRadiusLimit = 5;
        camera.upperRadiusLimit = 350;
        camera.upperBetaLimit   = Math.PI / 2 + 0.1;
        camera.inertia          = 0.9;  // smooth orbital damping
        camera.wheelPrecision   = 5;
        camera.attachControl(canvas, true);

        // Bloom post-processing — replaces EffectComposer + 5 post-processing scripts
        pipeline = new BABYLON.DefaultRenderingPipeline("pp", true, scene, [camera]);
        pipeline.bloomEnabled   = true;
        pipeline.bloomThreshold = 0.2;
        pipeline.bloomWeight    = 1.2;
        pipeline.bloomKernel    = 64;
        pipeline.bloomScale     = 0.5;

        setupLighting();
        setupEnvironment();
        setupProjectile();
        setupEffects();
        initECharts();

        window.addEventListener("resize", () => engine.resize());

        // Per-frame animation logic — replaces requestAnimationFrame loop
        scene.registerBeforeRender(animationLoop);
        // Revert camera shake after each render
        scene.registerAfterRender(() => {
          if (_shakeOX !== 0 || _shakeOY !== 0) {
            camera.target.x -= _shakeOX;
            camera.target.y -= _shakeOY;
            _shakeOX = _shakeOY = 0;
          }
        });

        engine.runRenderLoop(() => scene.render());
        if (scenarios.length > 0) selectScenario(0);
      }

      // ─── LIGHTING ─────────────────────────────────────────────────────
      function setupLighting() {
        // Ambient
        const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0,1,0), scene);
        hemi.intensity   = 0.6;
        hemi.groundColor = c3(0x0f172a);

        // Directional sun with PCF soft shadows
        const dir = new BABYLON.DirectionalLight("dir",
          new BABYLON.Vector3(-50,-100,-50).normalize(), scene);
        dir.intensity = 2.5;
        dir.diffuse   = c3(0xfff0dd);

        const sg = new BABYLON.ShadowGenerator(2048, dir);
        sg.usePoissonSampling = true;
        window._shadowGen = sg;

        // Fill point light
        const fill = new BABYLON.PointLight("fill", new BABYLON.Vector3(-30,20,-30), scene);
        fill.intensity = 1.0;
        fill.diffuse   = c3(0x38bdf8);
        fill.range     = 100;
      }

      // ─── ENVIRONMENT (ground grid) ────────────────────────────────────
      function setupEnvironment() {
        const half = 100, divs = 100, step = (half*2)/divs;
        for (let i = 0; i <= divs; i++) {
          const p = -half + i*step;
          const major = i % 10 === 0;
          const col = major ? new BABYLON.Color4(0.06,0.65,0.91,0.5)
                            : new BABYLON.Color4(0.12,0.16,0.24,0.5);
          BABYLON.MeshBuilder.CreateLines("gH"+i, {
            points:[new BABYLON.Vector3(-half,0.1,p), new BABYLON.Vector3(half,0.1,p)],
            colors:[col,col]
          }, scene);
          BABYLON.MeshBuilder.CreateLines("gV"+i, {
            points:[new BABYLON.Vector3(p,0.1,-half), new BABYLON.Vector3(p,0.1,half)],
            colors:[col,col]
          }, scene);
        }
      }

      // ─── TEXT SPRITE (replaces THREE.Sprite + CanvasTexture) ─────────
      function createTextSprite(msg, colorHex) {
        const uid = Math.random().toString(36).slice(2);
        const dt  = new BABYLON.DynamicTexture("dt"+uid, {width:256,height:128}, scene, false);
        const ctx = dt.getContext();
        ctx.font      = "Bold 36px 'JetBrains Mono', monospace";
        ctx.fillStyle = colorHex;
        ctx.fillText(msg, 10, 50);
        dt.update();
        const plane = BABYLON.MeshBuilder.CreatePlane("lbl"+uid, {width:20,height:10}, scene);
        const mat   = new BABYLON.StandardMaterial("lblm"+uid, scene);
        mat.diffuseTexture = dt; mat.emissiveTexture = dt;
        mat.disableLighting = true; mat.backFaceCulling = false;
        mat.useAlphaFromDiffuseTexture = true;
        plane.material      = mat;
        plane.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
        return plane;
      }

      // ─── RULERS ───────────────────────────────────────────────────────
      function rebuildRulers(maxAlt) {
        rulerMeshes.forEach(m => { if (!m.isDisposed()) { if(m.material) m.material.dispose(); m.dispose(); } });
        rulerMeshes = [];

        // Underground depth ruler (0-150 m)
        const dL = BABYLON.MeshBuilder.CreateLines("dLine",{
          points:[new BABYLON.Vector3(14,0,14), new BABYLON.Vector3(14,-150,14)]
        }, scene);
        dL.color = c3(0x38bdf8);
        rulerMeshes.push(dL);

        for (let d = 0; d <= 150; d++) {
          const major = d%10===0, medium = d%5===0 && !major;
          let len = 0.8, rad = 0.08;
          if (major) { len=3.5; rad=0.2; } else if (medium) { len=2.0; rad=0.12; }
          let tHex = 0x38bdf8;
          if (d>30) tHex=0xfacc15; if (d>80) tHex=0xf87171;
          const tk = BABYLON.MeshBuilder.CreateCylinder("td"+d,{diameter:rad*2,height:len,tessellation:6},scene);
          tk.rotation.z=Math.PI/2;
          tk.position=new BABYLON.Vector3(14+len/2,-d,14);
          const tm=new BABYLON.StandardMaterial("tdm"+d,scene);
          tm.emissiveColor=c3(tHex); tm.disableLighting=true;
          tk.material=tm; rulerMeshes.push(tk);
          if (major) {
            const sp=createTextSprite(d+"m","#"+tHex.toString(16).padStart(6,"0"));
            sp.position=new BABYLON.Vector3(14+len+3,-d,14); rulerMeshes.push(sp);
          }
        }

        // Air altitude ruler

      // ─── WEB AUDIO ANTHEM (unchanged) ─────────────────────────────────
      let audioCtx=null, anthemNodes=[];
      ["click","keydown","pointerdown"].forEach(e =>
        window.addEventListener(e,()=>{if(audioCtx&&audioCtx.state==="suspended")audioCtx.resume().catch(()=>{});},{passive:true})

      function playAnthem() {
        stopAnthem();
        try {
          audioCtx=new(window.AudioContext||window.webkitAudioContext)();
          if(audioCtx.state==="suspended")audioCtx.resume().catch(()=>{});
          const notes=[
            {f:392.0,d:0.35},{f:329.63,d:0.35},{f:261.63,d:0.6},{f:329.63,d:0.6},{f:392.0,d:0.6},{f:523.25,d:1.1},
            {f:659.25,d:0.7},{f:587.33,d:0.35},{f:523.25,d:0.6},{f:329.63,d:0.6},{f:370.0,d:0.6},{f:392.0,d:1.1},
            {f:392.0,d:0.35},{f:392.0,d:0.35},{f:659.25,d:0.7},{f:587.33,d:0.35},{f:523.25,d:0.6},
            {f:493.88,d:0.6},{f:440.0,d:0.6},{f:493.88,d:0.6},{f:523.25,d:1.2},
            {f:523.25,d:0.35},{f:523.25,d:0.35},{f:659.25,d:0.6},{f:698.46,d:0.6},{f:783.99,d:1.0},
            {f:783.99,d:0.6},{f:659.25,d:0.35},{f:587.33,d:0.6},{f:523.25,d:0.6},{f:587.33,d:1.2},
            {f:659.25,d:0.6},{f:659.25,d:0.35},{f:587.33,d:0.35},{f:523.25,d:0.6},{f:493.88,d:0.6},
            {f:440.0,d:0.6},{f:493.88,d:0.6},{f:523.25,d:1.4},
            {f:523.25,d:0.35},{f:523.25,d:0.35},{f:392.0,d:0.6},{f:329.63,d:0.6},{f:392.0,d:0.6},{f:523.25,d:1.4}
          ];
          let t=audioCtx.currentTime+0.05;
          const mg=audioCtx.createGain(); mg.gain.setValueAtTime(0.18,t); mg.connect(audioCtx.destination); anthemNodes.push(mg);
          notes.forEach(n=>{
            const osc=audioCtx.createOscillator(),g=audioCtx.createGain();
            osc.type="sawtooth"; osc.frequency.setValueAtTime(n.f,t);
            g.gain.setValueAtTime(0.001,t); g.gain.linearRampToValueAtTime(0.2,t+0.04);
            g.gain.exponentialRampToValueAtTime(0.001,t+n.d*0.95);
            osc.connect(g); g.connect(mg); osc.start(t); osc.stop(t+n.d);
            anthemNodes.push(osc,g); t+=n.d;
          });
        } catch(e){console.log("AudioCtx:",e);}
      }
      function stopAnthem() {
        anthemNodes.forEach(n=>{try{if(n.stop)n.stop();if(n.disconnect)n.disconnect();}catch(e){}});
        anthemNodes=[];

      }

      // ─── PLANCK BLACKBODY COLOR (adapted for BABYLON.Color3) ──────────
      function computePlanckBlackbodyColor(tempK, baseHex) {
        const base=c3(baseHex);
        if(tempK<500)  return base;
        if(tempK<900)  return BABYLON.Color3.Lerp(base,           c3(0xd97706),(tempK-500)/400);
        if(tempK<1500) return BABYLON.Color3.Lerp(c3(0xd97706),   c3(0xf97316),(tempK-900)/600);
        if(tempK<2200) return BABYLON.Color3.Lerp(c3(0xf97316),   c3(0xfffbeb),(tempK-1500)/700);
        return              BABYLON.Color3.Lerp(c3(0xfffbeb),   c3(0xe0f2fe),Math.min(1.0,(tempK-2200)/1000));
      }

      // ─── GBU-57 MESH (replaces mergeGeometriesSimple + createGBU57Geometry) ─
      function createGBU57Mesh(pRadius, pLength) {
        const nL=pLength*0.25, bL=pLength*0.55, tL=pLength*0.2;
        const hL=pLength/2, yN=-hL, yBs=yN+nL, yBe=yBs+bL, yTe=hL;
        const pts=[new BABYLON.Vector3(0,yN,0)];
        for(let i=1;i<=12;i++){
          const t=i/12;
          pts.push(new BABYLON.Vector3(pRadius*Math.sin(t*Math.PI*0.5), yN+t*nL, 0));
        }
        pts.push(new BABYLON.Vector3(pRadius,    yBs,0));
        pts.push(new BABYLON.Vector3(pRadius,    yBe*0.5,0));
        pts.push(new BABYLON.Vector3(pRadius*1.03,yBe*0.52,0));
        pts.push(new BABYLON.Vector3(pRadius*1.03,yBe*0.55,0));
        pts.push(new BABYLON.Vector3(pRadius,    yBe*0.57,0));
        pts.push(new BABYLON.Vector3(pRadius,    yBe,0));
        pts.push(new BABYLON.Vector3(pRadius*0.7,yTe-tL*0.2,0));
        pts.push(new BABYLON.Vector3(pRadius*0.5,yTe,0));
        pts.push(new BABYLON.Vector3(0,          yTe,0));
        const body=BABYLON.MeshBuilder.CreateLathe("body",{shape:pts,tessellation:32,sideOrientation:BABYLON.Mesh.DOUBLESIDE},scene);
        const parts=[body];
        const fW=pRadius*1.8,fH=tL*0.8,fT=pRadius*0.12;
        for(let a=0;a<4;a++){
          const ang=(a*Math.PI)/2;
          const f=BABYLON.MeshBuilder.CreateBox("fin"+a,{width:fT,height:fH,depth:fW},scene);
          f.rotation.y=-ang;
          f.position.x=Math.cos(ang)*(pRadius*0.5+fW/2);
          f.position.z=Math.sin(ang)*(pRadius*0.5+fW/2);
          f.position.y=yBe+fH*0.3;
          f.bakeCurrentTransformIntoVertices(); parts.push(f);
        }
        const sT=pRadius*0.12,sH=bL*0.5,sW=pRadius*0.25;
        for(let a=0;a<4;a++){
          const ang=(a*Math.PI)/2+Math.PI/4;
          const s=BABYLON.MeshBuilder.CreateBox("strk"+a,{width:sT,height:sH,depth:sW},scene);
          s.rotation.y=-ang;
          s.position.x=Math.cos(ang)*(pRadius+sT/2);
          s.position.z=Math.sin(ang)*(pRadius+sT/2);
          s.position.y=yBs+bL*0.4;
          s.bakeCurrentTransformIntoVertices(); parts.push(s);
        }
        return BABYLON.Mesh.MergeMeshes(parts,true,true)||body;
      }

      // Smooth camera move — replaces TWEEN-based animation
      function smoothCameraMove(px,py,pz,tx,ty,tz) {
        cameraAnimatables.forEach(a=>{try{a.stop();}catch(e){}});
        cameraAnimatables=[];
        const dx=px-tx,dy=py-ty,dz=pz-tz;
        const nr=Math.sqrt(dx*dx+dy*dy+dz*dz);
        const nb=Math.acos(Math.max(-1,Math.min(1,dy/nr)));
        const na=Math.atan2(dz,dx);
        const ease=new BABYLON.CubicEase();
        ease.setEasingMode(BABYLON.EasingFunction.EASINGMODE_EASEINOUT);
        const F=60,D=60;
        const push=a=>{if(a)cameraAnimatables.push(a);};
        push(BABYLON.Animation.CreateAndStartAnimation("ca",camera,"alpha", F,D,camera.alpha, na,0,ease));
        push(BABYLON.Animation.CreateAndStartAnimation("cb",camera,"beta",  F,D,camera.beta,  nb,0,ease));
        push(BABYLON.Animation.CreateAndStartAnimation("cr",camera,"radius",F,D,camera.radius,nr,0,ease));
        push(BABYLON.Animation.CreateAndStartAnimation("ct",camera,"target",F,D,camera.target.clone(),new BABYLON.Vector3(tx,ty,tz),0,ease));
      }

      // ─── FRAME INTERPOLATION (Optimized with Binary Search) ───────────
      function getInterpolatedFrame(frames,t) {
        if(!frames || frames.length===0)return null;
        if(t<=frames[0].t)return frames[0];
        if(t>=frames[frames.length-1].t)return frames[frames.length-1];
        
        let low = 0;
        let high = frames.length - 1;
        let idx = -1;
        while(low <= high) {
           let mid = Math.floor((low + high) / 2);
           if (frames[mid].t === t) {
               idx = mid;
               break;
           } else if (frames[mid].t < t) {
               low = mid + 1;
           } else {
               high = mid - 1;
           }
        }
        if (idx === -1) idx = low;
        if(idx===0)idx=1;
        
        const f0=frames[idx-1],f1=frames[idx];
        const fac=(t-f0.t)/(f1.t-f0.t);
        const L=(a,b)=>(a!==undefined&&b!==undefined)?a+(b-a)*fac:undefined;
        return {
          t,y:L(f0.y,f1.y),v:L(f0.v,f1.v),m:L(f0.m,f1.m),
          p:L(f0.p,f1.p),g:L(f0.g,f1.g),h:L(f0.h,f1.h),
          dif:L(f0.dif,f1.dif),rl:L(f0.rl,f1.rl),ob:L(f0.ob,f1.ob),
          obliquity_deg:f0.obliquity_deg!==undefined?L(f0.obliquity_deg,f1.obliquity_deg):(f0.ob!==undefined?L(f0.ob,f1.ob):undefined),
          aoa_deg:L(f0.aoa_deg,f1.aoa_deg),pr:L(f0.pr,f1.pr),
          sb:fac<0.5?f0.sb:f1.sb, e:fac<0.5?f0.e:f1.e
        };
      }

      // ─── SELECT SCENARIO ──────────────────────────────────────────────
      function selectScenario(index) {
        if(!scenarios[index])return;
        cameraAnimatables.forEach(a=>{try{a.stop();}catch(e){}});
        cameraAnimatables=[];
        stopAnthem();
        currentData=scenarios[index];
        if(window.ReactAPI)window.ReactAPI.setActiveScenarioIdx(index);

        let maxAlt=0;
        if(currentData.drop_frames&&currentData.drop_frames.length>0)
          maxAlt=Math.abs(currentData.drop_frames[0].y);

        clearMeshArray(targetLayerMeshes);
        clearMeshArray(airMeshes);

        // Volumetric air box
        const effAlt=maxAlt>0?maxAlt:60;
        const ab=BABYLON.MeshBuilder.CreateBox("ab",{width:100,height:effAlt,depth:100},scene);
        ab.position.y=effAlt/2;
        const abm=new BABYLON.PBRMaterial("abm",scene);
        abm.albedoColor=c3(0x0284c7); abm.alpha=0.05; abm.metallic=0; abm.roughness=0.1;
        ab.material=abm; ab.isPickable=false; airMeshes.push(ab);

        // Ambient falling dust (replaces THREE.Points + BufferAttribute per-frame update)
        if(ambientDustMesh&&!ambientDustMesh.isDisposed())ambientDustMesh.dispose();
        const DC=2500;
        ambientDustMaxH=effAlt+30; ambientDustScaleK=2.2/ambientDustMaxH;
        const sA=()=>{const u=Math.random();return -Math.log(1-u*(1-Math.exp(-2.2)))/ambientDustScaleK;};
        ambientDustPositions=new Float32Array(DC*3);
        const di=new Int32Array(DC);
        for(let i=0;i<DC;i++){
          ambientDustPositions[i*3]=(Math.random()-0.5)*150;
          ambientDustPositions[i*3+1]=sA();
          ambientDustPositions[i*3+2]=(Math.random()-0.5)*150;
          di[i]=i;
        }
        ambientDustMesh=new BABYLON.Mesh("ad",scene);
        const vd=new BABYLON.VertexData();
        vd.positions=ambientDustPositions; vd.indices=di;
        vd.applyToMesh(ambientDustMesh,true);
        const adm=new BABYLON.StandardMaterial("adm",scene);
        adm.emissiveColor=c3(0xbae6fd); adm.disableLighting=true;
        adm.pointsCloud=true; adm.pointSize=2; adm.alpha=0.6;
        ambientDustMesh.material=adm; airMeshes.push(ambientDustMesh);

        // Target layers
        let curY=0;
        if(currentData.target_layers&&currentData.target_layers.length>0){
          currentData.target_layers.forEach(layer=>{
            const th=Math.max(2,Math.min(60,layer.thickness));
            const bl=BABYLON.MeshBuilder.CreateBox("bl",{width:32,height:th-0.05,depth:32},scene);
            let ch=0x334155,ro=0.8,me=0.1;
            if(layer.density<2000){ch=0x5c4033;ro=1.0;me=0.0;}
            else if(layer.density>2600){ch=0x1e293b;ro=0.4;me=0.3;}
            const bm=new BABYLON.PBRMaterial("bm"+layer.name,scene);
            bm.albedoColor=c3(ch); bm.metallic=me; bm.roughness=ro; bm.alpha=0.6;
            bl.material=bm; bl.position.y=curY-th/2; bl.receiveShadows=true;
            targetLayerMeshes.push(bl); curY-=th;
          });
        }

        rebuildRulers(maxAlt);
        chartDataTime=[]; chartDataVel=[]; updateChart();

        // Crater
        if(activeCrater&&!activeCrater.isDisposed()){activeCrater.material=null;activeCrater.dispose();}
        const cm=new BABYLON.PBRMaterial("cm",scene);
        cm.albedoColor=c3(0xef4444); cm.emissiveColor=c3(0xb91c1c);
        cm.emissiveIntensity=2.5; cm.roughness=0.4; cm.metallic=0.2; cm.backFaceCulling=false;
        activeCrater=buildCraterMesh(0.1); activeCrater.material=cm; activeCrater.isVisible=false;

        // Rebuild projectile for new scenario dimensions
        if(projectile){
          const om=projectile.material; projectile.material=null; projectile.dispose();
          projectile=createGBU57Mesh(currentData.proj_diameter/2.0,currentData.proj_length);
          projectile.material=om;
          if(window._shadowGen)window._shadowGen.addShadowCaster(projectile);
        }

        if(!currentData.is_kinetic){
          projectile.material.metallic=0.3; projectile.material.albedoColor=c3(0x00ffff);
          projectile.material.emissiveColor=c3(0x00ffff); projectile.material.emissiveIntensity=10.0;
        } else {
          projectile.material.emissiveColor=c3(0x9333ea); projectile.material.emissiveIntensity=10.0;
        }

        projectile.scaling=new BABYLON.Vector3(1,1,1);
        projectile.position=new BABYLON.Vector3(0,maxAlt>0?maxAlt:50,0);
        projectile.rotation=new BABYLON.Vector3(0,0,Math.PI/2.0);
        projectile.isVisible=true;

        machCone._coneParts.forEach(c=>{c.isVisible=false;});
        shockwave.isVisible=false; shockwave.scaling=new BABYLON.Vector3(1,1,1); shockwave.material.alpha=0.6;
        explosionSphere.isVisible=false; explosionSphere.scaling=new BABYLON.Vector3(0.1,0.1,0.1); explosionSphere.material.alpha=0.9;
        boomRing.isVisible=false; boomRing.scaling=new BABYLON.Vector3(1,1,1); boomRing.material.alpha=0.9;

        buildFinalBadges(currentData);
        animState="PRE_DELAY"; simTime=0; prevFrame=null; explosionTriggered=false; cameraShake=0;
      }

      // ─── MAIN ANIMATION LOOP ──────────────────────────────────────────
      function animationLoop() {
        // getDeltaTime() returns ms — convert to seconds
        const dt=Math.min(engine.getDeltaTime()/1000,0.1);

        // Ambient dust fall — replaces THREE.Points BufferAttribute update
        if(ambientDustMesh&&ambientDustPositions&&!ambientDustMesh.isDisposed()){
          const sk=ambientDustScaleK;
          for(let i=1;i<ambientDustPositions.length;i+=3){
            const y=ambientDustPositions[i];
            const rho=Math.exp(-sk*y);
            ambientDustPositions[i]-=dt*(3.0+6.0*(1.0-rho));
            if(ambientDustPositions[i]<0){
              const u=Math.random();
              ambientDustPositions[i]=-Math.log(1-u*(1-Math.exp(-2.2)))/sk;
            }
          }
          ambientDustMesh.updateVerticesData(BABYLON.VertexBuffer.PositionKind,ambientDustPositions,false,false);
        }

        // Boom ring growth
        if(boomRing.isVisible){
          const s=boomRing.scaling.x+dt*boomRingGrowthRate;
          boomRing.scaling=new BABYLON.Vector3(s,s,s);
          boomRing.material.alpha-=dt*1.5;
          if(boomRing.material.alpha<=0)boomRing.isVisible=false;
        }

        // Shockwave spin
        if(shockwave.isVisible){shockwave.rotation.y+=dt*2;shockwave.rotation.x+=dt;}

        // ── State Machine ──────────────────────────────────────────────
        if(animState==="PRE_DELAY"){
          simTime+=dt;
          if(simTime>1.0){
            animState=(currentData.drop_frames&&currentData.drop_frames.length>0)?"DROPPING":"PENETRATING";
            playAnthem();
            if(animState==="DROPPING") simTime=currentData.drop_frames[0].t;
            else if(currentData.pen_frames&&currentData.pen_frames.length>0) simTime=currentData.pen_frames[0].t;
            else simTime=0;
          }
        } else if(animState==="DROPPING"){
          simTime+=dt*simSpeedMultiplier;
          const maxT=currentData.drop_frames[currentData.drop_frames.length-1].t;
          if(simTime<maxT){
            const frame=getInterpolatedFrame(currentData.drop_frames,simTime);
            projectile.position.y=frame.y;
            const maxDA=Math.abs(currentData.drop_frames[0].y)||60;
            const dp=Math.max(0,Math.min(1.0,1.0-frame.y/maxDA));
            const pitch=frame.pr!==undefined?frame.pr:(Math.PI/2.0)*(1.0-Math.pow(dp,0.75));
            projectile.rotation.z=pitch;

            if(frame.sb===true){
              boomRing.isVisible=true; boomRing.rotation.z=pitch;
              const ol=currentData.proj_length/2.0-1.8;
              boomRing.position.x=projectile.position.x-Math.sin(pitch)*ol;
              boomRing.position.y=projectile.position.y+Math.cos(pitch)*ol;
              boomRing.scaling=new BABYLON.Vector3(1,1,1); boomRing.material.alpha=1.0;
              boomRingGrowthRate=8.0+Math.min(30.0,frame.m)*1.2;
            }
            if(frame.v>343.0&&frame.m>1.0){
              machCone._coneParts.forEach(c=>{c.isVisible=true;});
              const sk2=2.2/(maxDA+30),rho=Math.exp(-sk2*Math.max(0,frame.y));
              const vf=Math.min(1.0,(frame.m-1.0)/0.7),int=vf*(0.35+0.65*rho);
              if(machCone._coneParts[0])machCone._coneParts[0].material.alpha=0.35*int;
              if(machCone._coneParts[1])machCone._coneParts[1].material.alpha=0.08*int;
              machCone.rotation.z=pitch;
              const ol=currentData.proj_length/2.0-1.8;
              machCone.position.x=projectile.position.x-Math.sin(pitch)*ol;
              machCone.position.y=projectile.position.y+Math.cos(pitch)*ol;
              const ma=Math.max(0.35,Math.min(1.2,1.4/Math.max(1.01,frame.m)));
              machCone.scaling=new BABYLON.Vector3(ma,1.0,ma);
            } else {
              machCone._coneParts.forEach(c=>{c.isVisible=false;});
            }
            updateHUD(frame); prevFrame=frame;
          } else {
            animState="PENETRATING";
            machCone._coneParts.forEach(c=>{c.isVisible=false;});
            shockwave.isVisible=false;
            if(currentData.pen_frames&&currentData.pen_frames.length>0)simTime=currentData.pen_frames[0].t;
            else simTime=0;
            prevFrame=null; cameraShake=currentData.camera_shake_magnitude;
          }
        } else if(animState==="PENETRATING"){
          if(!currentData.pen_frames||currentData.pen_frames.length===0){animState="EXPLODING";simTime=0;}
          else {
            const ps=currentData.pen_frames[0].t,pe=currentData.pen_frames[currentData.pen_frames.length-1].t;
            const pd=pe-ps,ts=pd>0?pd/5.0:1.0;
            simTime+=dt*ts*simSpeedMultiplier;
            if(simTime<pe){
              const frame=getInterpolatedFrame(currentData.pen_frames,simTime);
              const cl=frame.rl!==undefined?frame.rl:currentData.proj_length;
              projectile.scaling.y=cl/currentData.proj_length;
              projectile.position.y=-frame.y+cl/2.0;
              const oblD=frame.obliquity_deg!==undefined?frame.obliquity_deg:(frame.ob||0);
              const totalR=(oblD+(frame.aoa_deg||0))*(Math.PI/180);
              projectile.rotation.z=totalR;
              if(activeCrater&&!activeCrater.isDisposed())activeCrater.rotation.z=totalR;
              const tv=frame.h!==undefined?frame.h:20;
              const tK=tv<200?tv+273.15:tv;
              const bH=currentData.is_kinetic?0xa855f7:0x00ffff;
              const tc=computePlanckBlackbodyColor(tK,bH);
              projectile.material.emissiveColor=tc;
              const tn=Math.max(0,(tK-300)/1500);
              projectile.material.emissiveIntensity=2.0+Math.pow(tn,3.0)*18.0;
              const ji=(frame.g||0)/15000.0;
              projectile.position.x=(Math.random()-0.5)*ji;
              projectile.position.z=(Math.random()-0.5)*ji;
              if((currentData.shock_damage_prob_percent||0)>50.0&&Math.random()>0.8)
                projectile.material.albedoColor=new BABYLON.Color3(1,1,1);
              else projectile.material.albedoColor=c3(bH);

              // Live crater growth
              if(activeCrater&&!activeCrater.isDisposed()){
                const om2=activeCrater.material; activeCrater.material=null; activeCrater.dispose();
                activeCrater=buildCraterMesh(Math.abs(frame.y));
                activeCrater.material=om2; activeCrater.isVisible=true;
              }

              // Volumetric impact dust
              if(dustSPS){
                const pp=projectile.position;
                for(let i=0;i<20;i++){
                  const idx=Math.floor(Math.random()*1000);
                  const p=dustSPS.particles[idx];
                  p.position.x=pp.x+(Math.random()-0.5)*4.0;
                  p.position.y=pp.y-Math.random()*2.0;
                  p.position.z=pp.z+(Math.random()-0.5)*4.0;
                  const sc=Math.random()*2.0+0.5;
                  p.scaling.x=sc;p.scaling.y=sc;p.scaling.z=sc;p.isVisible=true;
                }
                dustSPS.setParticles();
              }
              updateHUD(frame); prevFrame=frame;
            } else {
              animState="PRE_EXPLOSION"; simTime=0;
            }
          }
        } else if(animState==="PRE_EXPLOSION"){
          simTime+=dt; if(simTime>1.0){animState="EXPLODING";simTime=0;}
        } else if(animState==="EXPLODING"){
          simTime+=dt;
          if(!explosionTriggered){
            explosionTriggered=true;
            if(currentData.is_kinetic){
              projectile.material.albedoColor=c3(0xc084fc);
              projectile.material.emissiveColor=c3(0x581c87);
              if(activeCrater&&!activeCrater.isDisposed()){
                activeCrater.material.albedoColor=c3(0xa855f7);
                activeCrater.material.emissiveColor=c3(0x7e22ce);
              }
            } else if(currentData.fail||!currentData.exp_survives){
              projectile.scaling=new BABYLON.Vector3(1.8,0.4,1.8);
              projectile.material.albedoColor=c3(0xf87171);
              projectile.material.emissiveColor=c3(0x7f1d1d);
              if(activeCrater&&!activeCrater.isDisposed()){
                activeCrater.material.albedoColor=c3(0xef4444);
                activeCrater.material.emissiveColor=c3(0xb91c1c);
              }
            } else {
              explosionSphere.isVisible=true;
              explosionSphere.position=projectile.position.clone();
              projectile.isVisible=false;
              const dT=currentData.detonation_temp_k||3400.0;
              const eH=dT>3800?0xfffbeb:dT>3200?0xfb923c:0xd97706;
              const eC=c3(eH);
              explosionSphere.material.albedoColor=eC;
              explosionSphere.material.emissiveColor=eC;
              explosionSphere.material.emissiveIntensity=5.0;
            }
          }
          if(explosionSphere.isVisible){
            const yJ=currentData.total_explosive_yield||0.0;
            const ms=Math.max(5.0,Math.min(50.0,yJ/2.5e8));
            const ns=explosionSphere.scaling.x+dt*Math.max(4.0,ms*1.25);
            explosionSphere.scaling=new BABYLON.Vector3(ns,ns,ns);
            if(ns>ms)explosionSphere.material.alpha-=dt*2.0;
            if(explosionSphere.material.alpha<=0){explosionSphere.isVisible=false;animState="DONE";simTime=0;stopAnthem();}
          } else if(shockwave.isVisible){
            const sgr=10.0+currentData.camera_shake_magnitude*10.0;
            const sw=shockwave.scaling.x+dt*sgr;
            shockwave.scaling=new BABYLON.Vector3(sw,sw,sw); shockwave.material.alpha-=dt*1.0;
            if(simTime>1.5){shockwave.isVisible=false;animState="DONE";simTime=0;stopAnthem();}
          } else {
            if(simTime>1.0){animState="DONE";simTime=0;stopAnthem();}
          }
        } else if(animState==="DONE"){
          simTime+=dt; if(simTime>2.0)animState="FINISHED";
        }

        // Follow cam — ArcRotateCamera: just update target to projectile position
        if(followCam&&projectile&&!projectile.isDisposed()){
          camera.target=projectile.position.clone();
        }

        // Camera shake — applied before render, reverted by afterRender callback
        if(cameraShake>0){
          _shakeOX=(Math.random()-0.5)*cameraShake*6;
          _shakeOY=(Math.random()-0.5)*cameraShake*6;
          camera.target.x+=_shakeOX;
          camera.target.y+=_shakeOY;
          cameraShake-=dt*1.5;
        }
      }

      window.onload=init;
    </script>
  </body>
